services:
  - type: web
    name: criptomed-backend
    env: python
    region: oregon
    plan: free
    buildCommand: |
      cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: criptomed-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: USE_HTTPS
        value: "true"
      - key: MIGRATE_DATABASE
        value: "true"

databases:
  - name: criptomed-db
    databaseName: criptomed
    user: criptomed_user
    plan: free
