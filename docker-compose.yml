services:
  db:
    image: postgres:16-alpine
    container_name: criptomed_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - db_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # PostgreSQL necesita: CHOWN, DAC_OVERRIDE, FOWNER, FSETID, KILL, SETGID, SETUID, SYS_CHROOT
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - FSETID
      - KILL
      - SETGID
      - SETUID
      - SYS_CHROOT
    # read_only: true comentado porque PostgreSQL necesita escribir en /var/lib/postgresql/data
    tmpfs:
      - /tmp
      - /var/run/postgresql
    mem_limit: 512m
    pids_limit: 100
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: criptomed_backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ENC_KEYS: ${ENC_KEYS}
      ENC_KEY_CURRENT: ${ENC_KEY_CURRENT}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      ENV: ${ENV}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3
    networks:
      - app_net
      - db_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # FastAPI necesita: NET_BIND_SERVICE para escuchar en puerto 8000
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    pids_limit: 50
    restart: unless-stopped

  edge:
    build:
      context: .
      dockerfile: docker/edge/Dockerfile
    container_name: criptomed_edge
    ports:
      - "8443:8443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_net
    # Endurecimiento temporalmente desactivado por problemas de permisos
    # security_opt:
    #   - no-new-privileges:true
    # cap_drop:
    #   - ALL
    # cap_add:
    #   - NET_BIND_SERVICE
    # tmpfs:
    #   - /tmp
    #   - /var/cache/nginx/client_temp
    #   - /var/cache/nginx/proxy_temp
    #   - /var/cache/nginx/fastcgi_temp
    #   - /var/cache/nginx/uwsgi_temp
    #   - /var/cache/nginx/scgi_temp
    #   - /var/run/nginx
    #   - /run
    mem_limit: 128m
    pids_limit: 30
    restart: unless-stopped

  init:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: criptomed_init
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - db_net
    # Init corre como root para tener acceso a las dependencias instaladas
    user: "0:0"
    command: >
      sh -c "
        python scripts/setup_db_docker.py &&
        python scripts/seed_db.py
      "
    profiles:
      - seed
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Init necesita: NET_BIND_SERVICE para conectar a db
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    pids_limit: 50
    restart: "no"

volumes:
  pgdata:

networks:
  app_net:
    # No internal para que edge pueda exponer puertos al host
  db_net:
    internal: true
