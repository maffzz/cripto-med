events {
    worker_connections 1024;
}

http {
    # Incluir tipos MIME
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Bloque 1: Redirección HTTP a HTTPS
    server {
        listen 8080;
        server_name localhost;

        # Redirigir todo el tráfico HTTP a HTTPS
        return 301 https://$host:$request_uri;
    }

    # Bloque 2: Servidor HTTPS con frontend y proxy a backend
    server {
        listen 0.0.0.0:8443 ssl http2;
        server_name localhost;

        # Certificados SSL (montados como volumen de solo lectura)
        ssl_certificate /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        # Solo TLS 1.3
        ssl_protocols TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers off;

        # Encabezados de seguridad HTTP
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        # csp del front: mismo origen; unsafe-inline cubre toasts (react-hot-toast)
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        server_tokens off;

        # Bloque 3: Servir frontend React (SPA)
        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;
        }

        # Bloque 4: Proxy a backend FastAPI
        # el front llama a /api/*; nginx reescribe y envia al backend interno
        location /api/ {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://backend:8000; # dns de compose (servicio backend)

            # Pasar IP real del cliente (sobrescribir, no anexar)
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;

            # Límite de tamaño del body
            client_max_body_size 1m;

            # Timeouts razonables
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
